<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FERTIRRIGAÇÃO | CLEALCO</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: #f8fafc; }
    
    #map { width: 100%; height: 100%; z-index: 1; }

    .glass {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .top-panel { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
    .header-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 16px; }
    .title { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; background: linear-gradient(135deg, #ffffff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-toggle { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    .search-body { padding: 16px; border-radius: 18px; display: flex; flex-direction: column; gap: 12px; transition: all 0.3s ease; transform-origin: top; }
    .search-body.collapsed { opacity: 0; transform: scaleY(0); pointer-events: none; position: absolute; visibility: hidden; }

    label { font-size: 11px; text-transform: uppercase; font-weight: 700; color: #94a3b8; letter-spacing: 0.5px; }
    select { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: #fff; font-size: 15px; outline: none; font-weight: 500; }
    select option { background: #0f172a; color: #fff; }

    .fab-group { position: absolute; bottom: 24px; right: 16px; z-index: 1000; display: flex; flex-direction: column; gap: 12px; }
    .fab { width: 50px; height: 50px; border-radius: 50%; border: none; color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .fab-gps { background: linear-gradient(135deg, #0284c7, #2563eb); }
    .fab-reset { background: linear-gradient(135deg, #475569, #334155); }

    #loader { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; transition: opacity 0.5s ease; }
    .spinner { width: 60px; height: 60px; border: 5px solid rgba(255, 255, 255, 0.1); border-top: 5px solid #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loader-text { font-size: 16px; font-weight: 700; color: #f8fafc; letter-spacing: 0.5px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    #update-toast { position: absolute; bottom: 84px; left: 16px; right: 16px; z-index: 2000; padding: 14px; border-radius: 14px; background: #16a34a; color: #fff; display: none; justify-content: space-between; align-items: center; font-weight: 600; font-size: 13px; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Carregando mapa e fazendas...</div>
  </div>

  <div class="top-panel">
    <div class="header-bar glass">
      <div class="title">FERTIRRIGAÇÃO | CLEALCO</div>
      <button class="btn-toggle" onclick="toggleMenu()">
        <span>👁️</span> Menu
      </button>
    </div>

    <div class="search-body glass" id="search-box">
      <div>
        <label>Pesquisar Fazenda (Layer)</label>
        <select id="layerSelect" onchange="filterMap()">
          <option value="">-- Todas as Fazendas --</option>
        </select>
      </div>
      <div style="font-size: 12px; color: #cbd5e1; display: flex; justify-content: space-between; font-weight: 500;">
        <span>(Visível com Zoom)</span>
        <span>🟢 Início | 🔴 Fim</span>
      </div>
    </div>
  </div>

  <div class="fab-group">
    <button class="fab fab-gps" onclick="locateUser()" title="Minha Localização">🎯</button>
    <button class="fab fab-reset" onclick="resetView()" title="Visão Geral">🔄</button>
  </div>

  <div id="update-toast">
    <span>Nova atualização disponível!</span>
    <button style="background:#fff; color:#16a34a; border:none; padding:8px 14px; border-radius:8px; font-weight:700; cursor:pointer;" onclick="window.location.reload()">Atualizar</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([-21.2, -50.3], 6);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Esri'
    }).addTo(map);

    let geojsonLayer = null;
    let rawData = null;
    let userLocationMarker = null;
    
    // MELHORIA DE PERFORMANCE: Camada de marcadores separada
    let markersLayer = L.layerGroup(); 
    const ZOOM_THRESHOLD = 14; // Zoom mínimo para os pontos aparecerem

    // Controle inteligente de exibição dos pontos pelo zoom
    map.on('zoomend', function() {
      if (map.getZoom() >= ZOOM_THRESHOLD) {
        if (!map.hasLayer(markersLayer)) map.addLayer(markersLayer);
      } else {
        if (map.hasLayer(markersLayer)) map.removeLayer(markersLayer);
      }
    });

    function toggleMenu() {
      document.getElementById('search-box').classList.toggle('collapsed');
    }

    fetch('./data.geojson')
      .then(res => res.json())
      .then(data => {
        rawData = data;
        populateDropdown(data);
        renderData(data);
        
        if (geojsonLayer && geojsonLayer.getBounds().isValid()) {
          map.fitBounds(geojsonLayer.getBounds(), { padding: [20, 20] });
        }

        setTimeout(() => {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
        }, 800); 
      })
      .catch(err => {
        console.error(err);
        document.querySelector('.loader-text').innerText = "Erro ao carregar mapa!";
        document.querySelector('.spinner').style.display = 'none';
      });

    function populateDropdown(data) {
      const select = document.getElementById('layerSelect');
      const layersSet = new Set();

      data.features.forEach(f => {
        if (f.properties && f.properties.layer !== undefined && f.properties.layer !== '') {
          layersSet.add(f.properties.layer);
        }
      });

      const sortedLayers = Array.from(layersSet).sort((a, b) => {
        return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
      });

      sortedLayers.forEach(lyr => {
        const opt = document.createElement('option');
        opt.value = lyr;
        opt.textContent = `Fazenda: ${lyr}`;
        select.appendChild(opt);
      });
    }

    function renderData(dataFilter) {
      if (geojsonLayer) map.removeLayer(geojsonLayer);
      markersLayer.clearLayers();

      geojsonLayer = L.geoJSON(dataFilter, {
        style: {
          color: '#000000', // Linha preta
          weight: 4,
          opacity: 1.0
        },
        onEachFeature: (feature, layer) => {
          let popupContent = '<div style="color:#0f172a; font-size:13px; max-height:200px; overflow-y:auto;">';
          for (let key in feature.properties) {
            if (key !== 'start_point' && key !== 'end_point') {
              let keyName = key.charAt(0).toUpperCase() + key.slice(1);
              popupContent += `<b>${keyName}:</b> ${feature.properties[key]}<br/>`;
            }
          }
          popupContent += '</div>';
          layer.bindPopup(popupContent);

          // MELHORIA DE PERFORMANCE: Uso de circleMarker (desenha via canvas/placa de video, nao trava o html)
          if (feature.properties.start_point) {
            L.circleMarker(feature.properties.start_point, {
                radius: 5, fillColor: '#22c55e', color: '#ffffff', weight: 1.5, opacity: 1, fillOpacity: 1
            }).addTo(markersLayer);
          }
          if (feature.properties.end_point) {
            L.circleMarker(feature.properties.end_point, {
                radius: 5, fillColor: '#ef4444', color: '#ffffff', weight: 1.5, opacity: 1, fillOpacity: 1
            }).addTo(markersLayer);
          }
        }
      }).addTo(map);
      
      // Força a checagem do zoom pra saber se já mostra os pontos ou não
      map.fire('zoomend');
    }

    function filterMap() {
      const val = document.getElementById('layerSelect').value;
      if (!val) {
        resetView();
        return;
      }

      const filteredFeatures = rawData.features.filter(f => String(f.properties.layer) === String(val));
      const filteredGeoJSON = { type: 'FeatureCollection', features: filteredFeatures };

      renderData(filteredGeoJSON);

      if (geojsonLayer.getBounds().isValid()) {
        map.fitBounds(geojsonLayer.getBounds(), { padding: [40, 40], maxZoom: 17, animate: true });
      }
    }

    function resetView() {
      document.getElementById('layerSelect').value = '';
      renderData(rawData);
      if (geojsonLayer && geojsonLayer.getBounds().isValid()) {
        map.fitBounds(geojsonLayer.getBounds(), { padding: [30, 30], animate: true });
      }
    }

    function locateUser() {
      if (!navigator.geolocation) {
        alert("Geolocalização não suportada no seu navegador.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          if (userLocationMarker) map.removeLayer(userLocationMarker);
          userLocationMarker = L.circleMarker([lat, lng], {
            radius: 8, fillColor: '#3b82f6', color: '#ffffff', weight: 3, opacity: 1, fillOpacity: 1
          }).addTo(map).bindPopup("<b>Você está aqui</b>").openPopup();
          map.setView([lat, lng], 17, { animate: true });
        },
        (err) => {
            if(err.code === 1) alert("Por favor, permita o acesso à sua localização.");
            else alert("Erro ao obter localização: " + err.message);
        },
        { enableHighAccuracy: true }
      );
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        reg.onupdatefound = () => {
          const installingWorker = reg.installing;
          installingWorker.onstatechange = () => {
            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
              document.getElementById('update-toast').style.display = 'flex';
            }
          };
        };
      });
    }
  </script>
</body>
</html>
