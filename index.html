<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FERTIRRIGAÇÃO | CLEALCO</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: #f8fafc; }
    #map { width: 100%; height: 100%; z-index: 1; }

    .glass {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .top-panel { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
    .header-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 16px; }
    .title { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; background: linear-gradient(135deg, #ffffff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-toggle { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    .search-body { padding: 16px; border-radius: 18px; display: flex; flex-direction: column; gap: 12px; transition: all 0.3s ease; transform-origin: top; }
    .search-body.collapsed { opacity: 0; transform: scaleY(0); pointer-events: none; position: absolute; visibility: hidden; }

    label { font-size: 11px; text-transform: uppercase; font-weight: 700; color: #94a3b8; }
    select { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: #fff; font-size: 15px; outline: none; font-weight: 500; }
    select option { background: #0f172a; color: #fff; }

    .action-btn { width: 100%; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s; }
    .action-btn:active { transform: scale(0.98); }
    .btn-download { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }
    .btn-update { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }

    .fab-group { position: absolute; bottom: 24px; right: 16px; z-index: 1000; display: flex; flex-direction: column; gap: 12px; }
    .fab { width: 50px; height: 50px; border-radius: 50%; border: none; color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .fab-gps { background: linear-gradient(135deg, #0284c7, #2563eb); }
    .fab-reset { background: linear-gradient(135deg, #475569, #334155); }

    #loader { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; transition: opacity 0.5s ease; }
    .spinner { width: 60px; height: 60px; border: 5px solid rgba(255, 255, 255, 0.1); border-top: 5px solid #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loader-text { font-size: 16px; font-weight: 700; color: #f8fafc; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    #progress-container { position: absolute; bottom: 24px; left: 16px; right: 80px; z-index: 1000; background: rgba(15, 23, 42, 0.95); padding: 12px; border-radius: 12px; display: none; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 10px 20px rgba(0,0,0,0.5);}
    .progress-bar { width: 100%; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .progress-fill { width: 0%; height: 100%; background: #22c55e; transition: width 0.2s; }
    .progress-text { font-size: 11px; font-weight: 600; color: #fff; }
    
    .checkbox-container { display: flex; align-items: center; gap: 8px; color: #e2e8f0; font-size: 13px; font-weight: 600; text-transform: none; cursor: pointer; }
  </style>
</head>
<body>

  <div id="loader"><div class="spinner"></div><div class="loader-text">Carregando mapa e dados operacionais...</div></div>

  <div class="top-panel">
    <div class="header-bar glass">
      <div class="title">FERTIRRIGAÇÃO | CLEALCO</div>
      <button class="btn-toggle" onclick="toggleMenu()"><span>👁️</span> Menu</button>
    </div>

    <div class="search-body glass collapsed" id="search-box">
      <div>
        <label>Pesquisar Fazenda (Linhas)</label>
        <select id="layerSelect" onchange="filterMap()">
          <option value="">-- Todas as Fazendas --</option>
        </select>
      </div>
      
      <hr style="border: 0; height: 1px; background: rgba(255,255,255,0.1); margin: 4px 0;">
      
      <div style="display: flex; flex-direction: column; gap: 10px;">
          <label class="checkbox-container">
            <input type="checkbox" id="toggleTalhoes" onchange="updateLayersVisibility()" checked> Exibir Talhões (Fundo Cinza)
          </label>
          <label class="checkbox-container">
            <input type="checkbox" id="togglePerimetro" onchange="updateLayersVisibility()" checked> Exibir Perímetro da Fazenda
          </label>
      </div>

      <hr style="border: 0; height: 1px; background: rgba(255,255,255,0.1); margin: 4px 0;">
      
      <div style="font-size: 12px; color: #cbd5e1; display: flex; justify-content: space-between; font-weight: 500;">
        <span>(Visível com Zoom)</span><span>🟢 Início | 🔴 Fim</span>
      </div>
      
      <button class="action-btn btn-download" onclick="downloadOfflineMap()">⬇️ Baixar Mapa para Uso Offline</button>
      <button class="action-btn btn-update" onclick="clearAndRefresh()">🔄 Atualizar Aplicativo (Requer Internet)</button>
    </div>
  </div>

  <div id="progress-container">
    <div class="progress-text" id="progress-text">Calculando o tamanho do download...</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <div class="fab-group">
    <button class="fab fab-gps" onclick="locateUser()" title="Minha Localização">🎯</button>
    <button class="fab fab-reset" onclick="resetView()" title="Visão Geral">🔄</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([-21.2, -50.3], 6);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, attribution: 'Esri', crossOrigin: true
    }).addTo(map);

    map.createPane('paneTalhoes');
    map.getPane('paneTalhoes').style.zIndex = 380; 
    
    map.createPane('panePerimetro');
    map.getPane('panePerimetro').style.zIndex = 390; 

    map.createPane('paneLinhas');
    map.getPane('paneLinhas').style.zIndex = 400; 

    let geojsonLayer = null;
    let rawData = null; 
    let markersLayer = L.layerGroup(); 
    let talhoesLayer = null;
    let perimetroLayer = null;

    const ZOOM_THRESHOLD = 14; 

    map.on('zoomend', function() {
      if (map.getZoom() >= ZOOM_THRESHOLD) {
        if (!map.hasLayer(markersLayer)) map.addLayer(markersLayer);
      } else {
        if (map.hasLayer(markersLayer)) map.removeLayer(markersLayer);
      }
    });

    function toggleMenu() { document.getElementById('search-box').classList.toggle('collapsed'); }

    Promise.all([
      fetch('./data.geojson').then(res => res.json()),
      fetch('./talhoes.geojson').then(res => res.json()),
      fetch('./perimetro.geojson').then(res => res.json())
    ]).then(([linhasData, talhoesData, perimetroData]) => {
        
        talhoesLayer = L.geoJSON(talhoesData, {
            pane: 'paneTalhoes',
            style: { fillColor: '#d3d3d3', color: '#94a3b8', weight: 1, fillOpacity: 0.5 },
            onEachFeature: (feature, layer) => {
                let pop = '<div style="color:#0f172a; font-size:13px; max-height:200px; overflow-y:auto;"><b>Informações do Talhão:</b><br/>';
                for (let k in feature.properties) pop += `<b>${k.charAt(0).toUpperCase() + k.slice(1)}:</b> ${feature.properties[k]}<br/>`;
                layer.bindPopup(pop + '</div>');
            }
        }).addTo(map);

        perimetroLayer = L.geoJSON(perimetroData, {
            pane: 'panePerimetro',
            style: { color: '#f59e0b', weight: 3, fill: false, opacity: 1.0 }, 
            interactive: false 
        }).addTo(map);

        rawData = linhasData;
        populateDropdown(rawData);
        renderData(rawData);

        if (geojsonLayer && geojsonLayer.getBounds().isValid()) {
            map.fitBounds(geojsonLayer.getBounds(), { padding: [20, 20] });
        }
        
        setTimeout(() => { 
            document.getElementById('loader').style.opacity = '0'; 
            setTimeout(() => document.getElementById('loader').style.display = 'none', 500); 
        }, 500); 

    }).catch(err => { 
        document.querySelector('.loader-text').innerText = "Erro ao carregar os dados. Verifique sua conexão com a internet."; 
        document.querySelector('.spinner').style.display = 'none'; 
        console.error(err);
    });

    function updateLayersVisibility() {
        const chkTalhoes = document.getElementById('toggleTalhoes').checked;
        const chkPerimetro = document.getElementById('togglePerimetro').checked;

        if (talhoesLayer) {
            chkTalhoes ? map.addLayer(talhoesLayer) : map.removeLayer(talhoesLayer);
        }
        if (perimetroLayer) {
            chkPerimetro ? map.addLayer(perimetroLayer) : map.removeLayer(perimetroLayer);
        }
    }

    function populateDropdown(data) {
      const select = document.getElementById('layerSelect');
      const layersSet = new Set();
      data.features.forEach(f => { if (f.properties && f.properties.layer) layersSet.add(f.properties.layer); });
      Array.from(layersSet).sort((a,b) => String(a).localeCompare(String(b), undefined, {numeric: true})).forEach(lyr => {
        const opt = document.createElement('option'); opt.value = lyr; opt.textContent = `Fazenda: ${lyr}`; select.appendChild(opt);
      });
    }

    function renderData(dataFilter) {
      if (geojsonLayer) map.removeLayer(geojsonLayer);
      markersLayer.clearLayers();
      
      geojsonLayer = L.geoJSON(dataFilter, {
        pane: 'paneLinhas', 
        style: { color: '#000000', weight: 4, opacity: 1.0 },
        onEachFeature: (feature, layer) => {
          let pop = '<div style="color:#0f172a; font-size:13px; max-height:200px; overflow-y:auto;">';
          for (let k in feature.properties) if (k !== 'start_point' && k !== 'end_point') pop += `<b>${k.charAt(0).toUpperCase() + k.slice(1)}:</b> ${feature.properties[k]}<br/>`;
          layer.bindPopup(pop + '</div>');
          
          if (feature.properties.start_point) L.circleMarker(feature.properties.start_point, {radius: 5, fillColor: '#22c55e', color: '#fff', weight: 1.5, opacity: 1, fillOpacity: 1, pane: 'paneLinhas'}).addTo(markersLayer);
          if (feature.properties.end_point) L.circleMarker(feature.properties.end_point, {radius: 5, fillColor: '#ef4444', color: '#fff', weight: 1.5, opacity: 1, fillOpacity: 1, pane: 'paneLinhas'}).addTo(markersLayer);
        }
      }).addTo(map);
      
      map.fire('zoomend');
    }

    function filterMap() {
      const val = document.getElementById('layerSelect').value;
      if (!val) return resetView();
      renderData({ type: 'FeatureCollection', features: rawData.features.filter(f => String(f.properties.layer) === String(val)) });
      if (geojsonLayer.getBounds().isValid()) map.fitBounds(geojsonLayer.getBounds(), { padding: [40, 40], maxZoom: 17, animate: true });
    }

    function resetView() {
      document.getElementById('layerSelect').value = ''; renderData(rawData);
      if (geojsonLayer.getBounds().isValid()) map.fitBounds(geojsonLayer.getBounds(), { padding: [30, 30], animate: true });
    }

    function locateUser() {
      if (!navigator.geolocation) return alert("Seu dispositivo ou navegador não suporta a função de localização (GPS).");
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude, lng = pos.coords.longitude;
          L.circleMarker([lat, lng], { radius: 8, fillColor: '#3b82f6', color: '#ffffff', weight: 3, opacity: 1, fillOpacity: 1 }).addTo(map).bindPopup("<b>Você está aqui</b>").openPopup();
          map.setView([lat, lng], 17, { animate: true });
        },
        (err) => alert(err.code === 1 ? "Por favor, permita o acesso à sua localização no navegador." : "Não foi possível obter a localização: " + err.message),
        { enableHighAccuracy: true }
      );
    }

    async function downloadOfflineMap() {
      if (!rawData || !rawData.features) return alert("Por favor, aguarde o carregamento completo dos dados antes de continuar.");
      
      const val = document.getElementById('layerSelect').value;
      const featuresToDownload = val 
            ? rawData.features.filter(f => String(f.properties.layer) === String(val)) 
            : rawData.features;

      const minZ = 12; 
      const maxZ = 16; 
      const tilesSet = new Set();

      document.getElementById('progress-container').style.display = 'block';
      const progText = document.getElementById('progress-text');
      progText.innerText = "Identificando as áreas necessárias para o download... Por favor, aguarde.";
      
      await new Promise(r => setTimeout(r, 50)); 

      featuresToDownload.forEach(feature => {
        const coordsList = feature.geometry.type === 'MultiLineString' ? feature.geometry.coordinates : [feature.geometry.coordinates];
        coordsList.forEach(line => {
          line.forEach(coord => {
            const latLng = L.latLng(coord[1], coord[0]); 
            for (let z = minZ; z <= maxZ; z++) {
              const p = map.project(latLng, z).divideBy(256).floor();
              for(let dx = -1; dx <= 1; dx++) {
                for(let dy = -1; dy <= 1; dy++) {
                  tilesSet.add(`${z}/${p.y + dy}/${p.x + dx}`);
                }
              }
            }
          });
        });
      });

      const urls = Array.from(tilesSet).map(t => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${t}`);
      
      const totalTiles = urls.length;
      const estimatedMB = ((totalTiles * 25) / 1024).toFixed(2);

      if(!confirm(`Cálculo concluído.
Serão baixados ${totalTiles} blocos de imagem que cobrem a área selecionada.

Tamanho estimado do download: ${estimatedMB} MB.

Deseja prosseguir com o download?`)) {
          document.getElementById('progress-container').style.display = 'none';
          return;
      }

      toggleMenu(); 
      const progFill = document.getElementById('progress-fill');

      try {
        const cache = await caches.open('ferti-tiles-v1');
        let downloaded = 0;
        
        const chunk = 20; 
        for (let i = 0; i < urls.length; i += chunk) {
          const lote = urls.slice(i, i + chunk);
          await Promise.all(lote.map(async (url) => {
            try {
              const existe = await caches.match(url);
              if (!existe) {
                const req = await fetch(url, { mode: 'cors' });
                if (req.ok) await cache.put(url, req);
              }
            } catch(e) {}
            downloaded++;
          }));
          const p = Math.round((downloaded / totalTiles) * 100);
          const currentMB = ((downloaded * 25) / 1024).toFixed(2);
          progFill.style.width = p + '%';
          progText.innerText = `Baixando: ${currentMB} MB de ${estimatedMB} MB (${p}%)`;
        }
        alert("Download concluído com sucesso. O mapa da área selecionada agora está disponível para uso offline.");
      } catch (err) {
        alert("Ocorreu um erro durante o download: " + err.message);
      }
      setTimeout(() => { document.getElementById('progress-container').style.display = 'none'; }, 2000);
    }

    async function clearAndRefresh() {
      if(!confirm("Tem certeza? Esta ação apagará o mapa offline salvo no dispositivo e fará o download da versão mais recente, utilizando sua conexão com a internet.")) return;
      try {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
        if (navigator.serviceWorker) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (let r of regs) await r.unregister();
        }
        alert("Dados atualizados com sucesso. O aplicativo será recarregado.");
        window.location.reload(true);
      } catch(e) { alert("Ocorreu um erro ao atualizar os dados: " + e.message); }
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
